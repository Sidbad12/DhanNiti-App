[tool.poetry]
name = "dhanniti"
version = "1.0.0"
description = "ML-powered NSE portfolio intelligence with agentic advisor and episodic memory"
authors = ["Sidbad12"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

# ── Data & NLP ────────────────────────────────────────────────
numpy          = ">=2.2.6"
pandas         = ">=2.3.2"
yfinance       = "^0.2.28"
scipy          = "^1.11.0"
feedparser     = "^6.0.10"
transformers   = "^4.35.0"
torch          = "^2.1.0"

# ── Feature engineering ───────────────────────────────────────
pandas-ta      = "0.4.71b0"
prophet        = "^1.1.5"
cmdstanpy      = "^1.2.0"

# ── ML ────────────────────────────────────────────────────────
scikit-learn   = "^1.3.0"
xgboost        = "^2.0.0"
shap           = "^0.51.0"
hmmlearn       = "^0.3.0"

# ── RL Agent ──────────────────────────────────────────────────
gymnasium          = "^0.29.0"
stable-baselines3  = "^2.3.0"

# ── LLM & Agentic Orchestration ────────────────────────────────
groq           = "^0.9.0"
instructor     = "^1.3.0"
langgraph      = "^0.2.0"
langchain-core = "^0.2.0"

# ── Vector memory ─────────────────────────────────────────────
qdrant-client  = "^1.9.0"
mem0ai         = "^0.1.0"
sentence-transformers = "^3.0.0"

# ── API ───────────────────────────────────────────────────────
fastapi        = "^0.110.0"
uvicorn        = "^0.29.0"
websockets     = "^14.1"
apscheduler    = "^3.10.4"

# ── MLOps ────────────────────────────────────────────────────
mlflow         = "^2.12.0"
dagshub        = "^0.3.0"

# ── Database / Dashboard ─────────────────────────────────────
supabase       = "^2.23.0"
plotly         = "^6.4.0"
altair         = "^5.5.0"

# ── Utilities ────────────────────────────────────────────────
python-dotenv       = "^1.2.1"
pandas-market-calendars = "^5.1.3"
matplotlib          = "^3.7.0"
seaborn             = "^0.12.0"
jupyter             = "^1.0.0"
ipykernel           = "^6.25.0"
flask = "^3.1.3"
flask-socketio = "^5.6.1"
polars = "^1.41.0"
fyers-apiv3 = "^3.1.12"
sqlalchemy = "^2.0.50"
pyotp = "^2.9.0"
eventlet = "^0.41.0"


[tool.poetry.group.dev.dependencies]
pytest        = "^7.4.0"
pytest-cov    = "^4.1.0"
pytest-mock   = "^3.11.0"
black         = "^23.7.0"
ruff          = "^0.0.285"
mypy          = "^1.5.0"
pre-commit    = "^3.4.0"


[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length    = 100
target-version = ['py312']

[tool.ruff]
line-length    = 100
target-version = "py312"
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version       = "3.12"
warn_return_any      = true
warn_unused_configs  = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
markers = [
  "integration: live data / PPO checkpoint required",
]
addopts = [
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--strict-markers",
]
